*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;overscroll-behavior-y:contain}
body{margin:0;min-height:100vh;font:16px/1.5 'Noto Sans Thai',Sarabun,system-ui,sans-serif;color:var(--ink)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{position:fixed;top:0;left:0;right:0;height:var(--hh);padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:6;color:#fff;background:linear-gradient(135deg,#ff3c20,#d6200f);box-shadow:0 2px 14px rgba(150,15,8,.32)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{height:26px;aspect-ratio:2.531;flex:none;background:var(--logo) center/contain no-repeat}
.bt{padding-left:12px;border-left:1px solid rgba(255,255,255,.45);line-height:1.15;min-width:0;overflow:hidden}.bt b{display:block;font-size:18px;letter-spacing:.18em}.bt small{display:block;font-size:10px;letter-spacing:.04em;opacity:.92;white-space:nowrap}

 synced[c]=1;save();flush();setSt('ซิงค์แล้ว');refresh()},e=>setSt('ซิงค์ไม่ได้: '+(e.code||e.message)))}

 const q=Math.max(1,+r.qty||1),id=esc(r.id);
 return '<div class="card'+(e?' x':'')+(OPEN.has(String(r.id))?' open':'')+'" data-a="open" data-v="'+id+'" style="--c:'+ST[k][1]+'"><div class="ci"><div class="cn"><b>'+esc(r.name||r.barcode)+'</b><div class="mut">'+esc(r.barcode)+' · ชั้น '+esc(r.shelf||'-')+(r.pos?' · '+esc(r.pos):'')+'<span class="qi"> · '+esc(r.qty)+' '+esc(r.unit)+'</span></div></div><div class="cr"><span class="pill" style="background:'+ST[k][1]+';color:'+ST[k][2]+'">'+(t||ST[k][0])+'</span><div class="dq"><div class="mut">'+fd(r.expDate)+'</div><div class="qn" style="color:'+ST[k][1]+'">'+q+'</div>'+(r.unit?'<div class="qun mut">'+esc(r.unit)+'</div>':'')+'</div></div></div><div class="more"><div class="qs" data-a="qs"><div class="qh">คงเหลือ'+(r.unit?' ('+esc(r.unit)+')':'')+'</div><div class="qc"><button type="button" data-a="qd" data-v="'+id+'" aria-label="ลดจำนวน"'+(q<=1?' disabled':'')+'>−</button><input data-a="qin" data-v="'+id+'" type="number" inputmode="numeric" min="1" max="99999" value="'+q+'" aria-label="จำนวนคงเหลือ"><button type="button" data-a="qu" data-v="'+id+'" aria-label="เพิ่มจำนวน">+</button></div></div><div class="ma" data-a="qs"><button data-a="ed" data-v="'+id+'">'+IX.ed+'แก้ไข</button><button class="dg" data-a="rm" data-v="'+id+'">'+(e?IX.ok+'เอาออกแล้ว':IX.rm+'ลบ')+'</button></div></div></div>'};

 try{if('BarcodeDetector' in window){const ms=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=ms;await v.play();
   const d=new BarcodeDetector();let on=1;stopCam=()=>{on=0;ms.getTracks().forEach(t=>t.stop())};
   (async()=>{while(on){try{const r=await d.detect(v);if(r[0]){got(r[0].rawValue);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}})()
  }else{await new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
   const z=new ZXing.BrowserMultiFormatReader();stopCam=()=>z.reset();z.decodeFromConstraints({video:{facingMode:'environment'}},'vid',r=>{if(r)got(r.getText())})}

function drawTl(p){const c=$('#tl');if(!c)return;const w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);

 x.strokeStyle='rgba(0,0,0,.08)';[0,.5,1].forEach(f=>{const y=4+H*(1-f);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()});

 if(k!='d'){const n=dim(DR.y,DR.m),dw=$('#dr [data-w=d]');DR.d=Math.min(DR.wd||DR.d,n);if(dw.children.length!=n){dw._s=-1;dw.innerHTML=drDays(n)}drGo(dw,DR.d-1)}
 DR.set=1;$('#dr').classList.remove('un');$('#ex').value=DR.y+'-'+p2(DR.m)+'-'+p2(DR.d);prev();svDraft()}
/* พิมพ์ตัวเลขบนแป้นพิมพ์ได้: โฟกัสที่ล้อ แล้วพิมพ์ เช่น วัน 12 → Tab → เดือน 12 → Tab → ปี 2029 (ปี 2 หลัก = 20xx) · ↑/↓ เลื่อนทีละช่อง */
const drIdx=w=>Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/ITM)));
function drPick(w,i){drGo(w,Math.max(0,Math.min(w.children.length-1,i)));drCommit(w)}
function drType(w,c){const k=w.dataset.w,L=k=='y'?4:2,pk=b=>{const n=+b;
  if(k=='d')return n>=1&&n<=31?Math.min(n,dim(DR.y,DR.m))-1:-1;
  if(k=='m')return n>=1&&n<=12?n-1:-1;
  const v=b.length==4?n:b.length==2?2000+n:0;return v>=DR.y0&&v<=2099?v-DR.y0:-1};
 let b=(w._b||'')+c;if(b.length>L)b=c;let i=pk(b);if(i<0&&k!='y'&&b.length>1){b=c;i=pk(b)}
 w._b=b;clearTimeout(w._bt);w._bt=setTimeout(()=>{w._b=''},1500);
 if(i<0)return;
 if(k=='y')while(w.children.length<=i)w.insertAdjacentHTML('beforeend','<div data-i="'+w.children.length+'">'+(DR.y0+w.children.length)+'</div>');
 drPick(w,i);if(k=='d')DR.wd=+b}
function drInit(){const dr=$('#dr');if(!dr)return;const v=$('#ex').value,m=/^(\d{4})-(\d\d)-(\d\d)/.exec(v||''),t=new Date(),ty=t.getFullYear();
 let y=ty,mo=t.getMonth()+1,d=t.getDate();if(m){y=+m[1];mo=+m[2];d=+m[3]}
 DR.y0=Math.min(ty-1,y);DR.y=y;DR.m=mo;DR.d=Math.min(d,dim(y,mo));DR.wd=DR.d;DR.set=m?1:0;dr.classList.toggle('un',!DR.set);
 const yrs=Array.from({length:Math.max(ty+10,y)-DR.y0+1},(_,i)=>DR.y0+i);
 dr.innerHTML=[['d',drDays(dim(y,mo)),'วัน'],['m',drList(MO.map((t,i)=>(i+1)+' '+t)),'เดือน'],['y',drList(yrs),'ปี']].map(([k,h,l])=>'<div class="dw" data-w="'+k+'" role="listbox" aria-label="'+l+'">'+h+'</div>').join('');
 dr.querySelectorAll('.dw').forEach(w=>{let tm,raf;w._s=-1;w.tabIndex=0;
  w.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const d=/^(?:Digit|Numpad)(\d)$/.exec(e.code||'');
   if(d){e.preventDefault();drType(w,d[1])}else if(e.key=='ArrowUp'||e.key=='ArrowDown'){e.preventDefault();drPick(w,drIdx(w)+(e.key=='ArrowUp'?-1:1))}});
  const u=()=>{w._u=1};['pointerdown','wheel','touchstart'].forEach(ev=>w.addEventListener(ev,u,{passive:true}));
  w.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>drMark(w));clearTimeout(tm);tm=setTimeout(()=>{if(w._u)drCommit(w)},110)},{passive:true});
  w.addEventListener('click',e=>{const it=e.target.closest('[data-i]');if(!it)return;w._u=1;const i=+it.dataset.i;if(Math.round(w.scrollTop/ITM)==i)drCommit(w);else w.scrollTo({top:i*ITM,behavior:'smooth'})});
  const o={d:DR.d-1,m:DR.m-1,y:DR.y-DR.y0};drGo(w,o[w.dataset.w])})}
function drSet(v){$('#ex').value=v;drInit();prev();svDraft()}
/* ── หน่วยอัตโนมัติ + บันทึกร่างอัตโนมัติ ── */
const AU={base:'',m:0},DK='eh-draft';
const nameUnit=n=>{const m=/(?:^|[^A-Za-z])[x×]\s*(\d{1,2})(?!\d)/i.exec(n||'');if(m){const k=+m[1];if(k==12||k==24)return'ลัง';if(k>=2)return'แพ็ค'}return /แคน/.test(n||'')?'กระป๋อง':''};
function autoUnit(){if(!$('#un')||AU.m)return;setUnit(nameUnit($('#nm').value)||(AU.base=='ชิ้น'?'':AU.base))}
function setUnit(v){$('#un').value=v;ucRender()}
let UN=null;try{UN=JSON.parse(localStorage.getItem('eh-units'))}catch(e){}
if(!Array.isArray(UN)||!UN.length)UN=['กระป๋อง','ขวด','แพ็ค','ลัง'];
try{if(!localStorage.getItem('eh-units-v2')){UN=UN.filter(u=>u!='ชิ้น');localStorage.setItem('eh-units-v2','1');localStorage.setItem('eh-units',JSON.stringify(UN))}}catch(e){}
const svUN=()=>{try{localStorage.setItem('eh-units',JSON.stringify(UN))}catch(e){}};
function ucRender(){const c=$('#uc');if(!c)return;const v=$('#un').value,L=!v||UN.includes(v)?UN:UN.concat(v);
 c.innerHTML=L.map(u=>'<button type="button" class="chip'+(u==v?' on':'')+'" data-a="unit" data-v="'+esc(u)+'">'+esc(u)+'</button>').join('')}
function ulRender(){const c=$('#ul');if(c)c.innerHTML=UN.map(u=>'<button type="button" class="chip" data-a="delU" data-v="'+esc(u)+'">'+esc(u)+' ✕</button>').join('')}
function fixPiece(){const f=x=>x.unit=='ชิ้น',R=S.records.filter(f),C=S.catalog.filter(f);if(!R.length&&!C.length){toast('ไม่มีหน่วยชิ้นแล้ว');return}
 if(!confirm('เปลี่ยนหน่วย "ชิ้น" ของ '+R.length+' รายการ และ '+C.length+' สินค้า ตามชื่อ (ไม่เข้าเงื่อนไข = ขวด) ?'))return;
 const m=x=>({...x,unit:nameUnit(x.name)||'ขวด'});putMany('records',R.map(m));putMany('catalog',C.map(m));$('#sdlg').close();render();toast('เปลี่ยนหน่วยแล้ว')}
function addU(){const i=$('#nu'),v=i.value.trim();if(!v)return;if(!UN.includes(v)){UN.push(v);svUN()}i.value='';ulRender();ucRender()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a=unit],[data-a=addU],[data-a=delU],[data-a=fixU]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='fixU')fixPiece();else if(a=='unit'){AU.m=1;setUnit(v);svDraft()}else if(a=='addU')addU();
 else if(UN.length>1&&confirm('ลบหน่วย "'+v+'" ?')){UN=UN.filter(x=>x!=v);svUN();ulRender();ucRender()}});
document.addEventListener('keydown',e=>{if(e.target.id=='nu'&&e.key=='Enter'){e.preventDefault();addU()}});
const ldDraft=()=>{try{return JSON.parse(localStorage.getItem(DK)||'null')}catch(e){return null}};
const clDraft=()=>{try{localStorage.removeItem(DK)}catch(e){}};
function svDraft(){if(!$('#rf'))return;const g=i=>($(i)||{}).value||'',f={barcode:g('#bc'),name:g('#nm'),expDate:g('#ex'),qty:+g('#qt')||1,unit:g('#un'),shelf:g('#sh')=='__new'?'':g('#sh'),pos:g('#ps'),note:g('#nt')};
 try{if(!f.barcode&&!f.name&&!f.expDate)localStorage.removeItem(DK);else localStorage.setItem(DK,JSON.stringify({id:edit?edit.id:'',f}))}catch(e){}}
document.addEventListener('input',e=>{if(!(e.target.closest&&e.target.closest('#rf')))return;const i=e.target.id;if(i=='un')AU.m=1;else if(i=='nm'||i=='qt')autoUnit();svDraft()});
/* ── dropdown ค้นหาสินค้าจากบาร์โค้ด / ชื่อบางส่วน ── */
const AC={list:[],i:-1,k:[]};
function acFind(t){const k=t.toLowerCase().trim().split(/\s+/).filter(Boolean);AC.k=k;if(t.trim().length<2)return[];const q=k[0],nq=norm(q),o=[];
 for(const p of S.catalog){const b=String(p.barcode||''),n=String(p.name||'').toLowerCase(),h=n+' '+b;if(!k.every(x=>h.includes(x)))continue;
  const s=nq&&norm(b)==nq?0:b.endsWith(q)?1:b.startsWith(q)?2:n.startsWith(q)?3:b.includes(q)?4:5;o.push([s,n.indexOf(q),p])}
 return o.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,8).map(x=>x[2])}
function hl(s,k){s=String(s??'');const l=s.toLowerCase();if(l.length!=s.length)return esc(s);const m=new Array(s.length).fill(0);
 k.forEach(x=>{let i=l.indexOf(x);while(i>=0){for(let j=i;j<i+x.length;j++)m[j]=1;i=l.indexOf(x,i+x.length)}});
 let o='',on=0;for(let i=0;i<s.length;i++){if(m[i]!=on){o+=on?'</mark>':'<mark>';on=m[i]}o+=esc(s[i])}return o+(on?'</mark>':'')}
function acShow(inp){const box=$('#ac');if(!box)return;const L=acFind(inp.value);AC.list=L;AC.i=-1;
 if(!L.length||(L.length==1&&inp.id=='bc'&&norm(L[0].barcode)==norm(inp.value))){box.hidden=true;return}
 box.innerHTML=L.map((p,i)=>'<div class="aci" data-i="'+i+'"><b>'+hl(p.name,AC.k)+'</b><span>'+hl(p.barcode,AC.k)+' · '+esc(p.unit||'-')+(p.category?' · '+esc(p.category):'')+'</span></div>').join('');
 box.hidden=false;box.style.left='0px';box.style.width=$('#rf').clientWidth+'px';
 const vh=()=>window.visualViewport?visualViewport.height:innerHeight,nav=innerWidth<900?84:8;
 let r=inp.getBoundingClientRect();
 if(vh()-r.bottom-nav<220){scrollBy(0,r.top-(innerWidth<900?80:100));r=inp.getBoundingClientRect()}
 box.style.maxHeight=Math.max(150,Math.min(336,vh()-r.bottom-nav))+'px';box.style.top=(inp.offsetTop+inp.offsetHeight+2)+'px'}
function acPick(p){if(!p)return;$('#bc').value=p.barcode;$('#nm').value=p.name;$('#un').value=p.unit||'';
 if(!edit){const l=last(p.barcode);if(l){shSet(l.shelf||'');$('#ps').value=l.pos||''}}
 AU.base=p.unit||'';AU.m=0;autoUnit();svDraft();hint();$('#ac').hidden=true;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function acMark(){[...$('#ac').children].forEach((c,i)=>{c.classList.toggle('on',i==AC.i);if(i==AC.i)c.scrollIntoView({block:'nearest'})})}
document.addEventListener('mousedown',e=>{if(e.target.closest('#ac'))e.preventDefault()});
document.addEventListener('click',e=>{const it=e.target.closest('.aci');if(it)acPick(AC.list[+it.dataset.i])});
document.addEventListener('focusout',e=>{if(e.target.id=='bc'||e.target.id=='nm'){const b=$('#ac');if(b)b.hidden=true}});
document.addEventListener('keydown',e=>{const b=$('#ac');if(!b||b.hidden||!(e.target.id=='bc'||e.target.id=='nm'))return;const n=AC.list.length;
 if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();AC.i=e.key=='ArrowDown'?(AC.i+1)%n:(AC.i<=0?n-1:AC.i-1);acMark()}
 else if(e.key=='Enter'&&AC.i>=0){e.preventDefault();acPick(AC.list[AC.i])}else if(e.key=='Escape')b.hidden=true});
/* ครั้งแรกหลังอัปเดต: ลงทะเบียนชื่อเชลฟ์ที่มีอยู่ในรายการเดิม เพื่อให้เชลฟ์ไม่หายเมื่อสินค้าในเชลฟ์ถูกลบหมด */
if(!S.sh1){S.sh1=1;const n=[...new Set(S.records.map(r=>sn(r.shelf)).filter(Boolean))].filter(x=>!S.shelves.some(s=>sn(s.name)==x));if(n.length)putMany('shelves',n.map(name=>({name})));else save()}
/* ── ติดตั้งเป็นแอป (PWA) · ลงทะเบียน service worker ./sw.js (ชื่อเดิมของ Expire Hunter → เครื่องเก่าจะอัปเดตมาเป็นของ SMS เอง) ── */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
let IP=null;
const isSA=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,
 isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1),
 insHid=()=>{try{return Date.now()-(+localStorage.getItem('sms-ins-x')||0)<6048e5}catch(e){return false}};
function insShow(force){if(isSA())return;
 if(IP){$('#inst').textContent='เปิดจากหน้าจอโฮมได้เลย แบบเต็มจอ';$('#insb').hidden=false}
 else if(isIOS){$('#inst').textContent='แตะปุ่มแชร์ (สี่เหลี่ยมมีลูกศร) แล้วเลือก “เพิ่มลงในหน้าจอโฮม”';$('#insb').hidden=true}
 else if(force){$('#inst').textContent='เปิดเมนูของเบราว์เซอร์ (⋮) แล้วเลือก “ติดตั้งแอป” หรือ “เพิ่มลงในหน้าจอหลัก”';$('#insb').hidden=true}
 else return;
 $('#ins').hidden=false}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;if(!insHid())insShow()});
addEventListener('appinstalled',()=>{IP=null;$('#ins').hidden=true;$('#insrow').hidden=true;toast('ติดตั้งแล้ว เปิดจากหน้าจอโฮมได้เลย')});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-i]');if(!b)return;const a=b.dataset.i;
 if(a=='x'){$('#ins').hidden=true;try{localStorage.setItem('sms-ins-x',Date.now())}catch(_){}}
 else if(a=='go'&&IP){const p=IP;IP=null;$('#ins').hidden=true;p.prompt();try{await p.userChoice}catch(_){}}
 else if(a=='set'){const d=$('#sdlg');if(d.open)d.close();insShow(true)}});
if(isSA())$('#insrow').hidden=true;else{$('#insrow').hidden=false;if(isIOS&&!insHid())setTimeout(()=>insShow(),1500)}
